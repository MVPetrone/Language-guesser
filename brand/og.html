<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guess the Language — share card</title>
<!-- Source for public/og.png (1200×630) and public/og-square.png (1200×1200).
     Render with `node brand/tools/build.mjs` (inlines fonts + images first). -->
<link rel="stylesheet" href="../public/fonts/fonts.css">
<style>
  /* Fallback so the file also works opened from a static server at repo root,
     where fonts.css's root-absolute /fonts/ URLs do not resolve. */
  @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../public/fonts/SpaceGrotesk-700-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(../public/fonts/Inter-600-latin.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(../public/fonts/JetBrainsMono-500-latin.woff2) format('woff2'); }

  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #06080c; }
  body { position: relative; display: grid; place-items: center; color: #edf1f7; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .aperture { position: relative; width: min(46vh, 440px); aspect-ratio: 1; display: grid; place-items: center; }
  .aperture img { width: 100%; height: 100%; display: block; position: relative; }
  /* calibration guides: a hairline circle and four ticks around the mark */
  .aperture::before { content: ''; position: absolute; inset: -9%; border: 1px solid rgba(87, 227, 201, 0.28); border-radius: 50%; }
  .tick { position: absolute; background: #57e3c9; opacity: .7; }
  .tick.t, .tick.b { width: 1px; height: 4.5%; left: 50%; }
  .tick.l, .tick.r { height: 1px; width: 4.5%; top: 50%; }
  .tick.t { top: -16% } .tick.b { bottom: -16% } .tick.l { left: -16% } .tick.r { right: -16% }
  .word { width: 540px; margin-top: min(8.5vh, 72px); display: block; }
  .tag { margin: 22px 0 0; font: 600 30px/1.2 'Inter', system-ui, sans-serif; letter-spacing: -0.01em; color: #c7ceda; }
  .mono { position: absolute; font: 500 15px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .09em; text-transform: uppercase; color: #98a2b3; }
  .mono b { color: #57e3c9; font-weight: 500; }
  .tl { top: 40px; left: 44px } .tr { top: 40px; right: 44px } .bl { bottom: 40px; left: 44px } .br { bottom: 40px; right: 44px }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="mono tl"><b>●</b> Listening</div>
<div class="mono tr">76 languages</div>
<div class="mono bl">mvpetrone.github.io/Language-guesser</div>
<div class="mono br">10 rounds · 3 lives</div>
<main class="stage">
  <div class="aperture">
    <i class="tick t"></i><i class="tick b"></i><i class="tick l"></i><i class="tick r"></i>
    <img src="mark.svg" alt="">
  </div>
  <img class="word" src="wordmark.svg" alt="Guess the Language">
  <p class="tag">Hear one sentence. Name the language.</p>
</main>
<script>
  // The dot field: the world printed as data. Density rises in a few soft
  // "continents"; deterministic so every render is identical.
  const c = document.getElementById('field')
  const dpr = window.devicePixelRatio || 1
  const W = innerWidth, H = innerHeight
  c.width = W * dpr; c.height = H * dpr
  const g = c.getContext('2d'); g.scale(dpr, dpr)
  const blobs = [[.18, .32, .16], [.3, .72, .12], [.52, .28, .18], [.58, .66, .1], [.8, .38, .17], [.86, .76, .09]]
  let seed = 7
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
  const step = 18
  for (let y = step / 2; y < H; y += step) {
    for (let x = step / 2; x < W; x += step) {
      let d = 0
      for (const [bx, by, br] of blobs) {
        const dx = (x / W - bx) * (W / H), dy = y / H - by
        d += Math.exp(-(dx * dx + dy * dy) / (2 * br * br))
      }
      const centre = Math.hypot((x - W / 2) / H, (y - H / 2) / H)
      const fade = Math.min(1, Math.max(0, (centre - .2) / .28))
      const a = Math.min(.55, .05 + d * .32) * fade
      if (rnd() < .12 + d * .7) {
        g.fillStyle = `rgba(152, 162, 179, ${a.toFixed(3)})`
        g.beginPath(); g.arc(x, y, 1.3, 0, Math.PI * 2); g.fill()
      }
    }
  }
</script>
</body>
</html>
