<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lingo Guess — score sting (1080 × 1080, 2 s)</title>
<link rel="stylesheet" href="../../src/styles/tokens.css">
<link rel="stylesheet" href="motion-kit.css">
<style>
  /* The number is real text so it gets tabular figures, like the HUD. */
  .score {
    position: absolute;
    left: 0;
    right: 0;
    top: 452px;
    font: 700 250px/1 var(--font-display);
    letter-spacing: var(--tracking-display);
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--fog-100);
    transform-origin: 50% 60%;
  }
</style>
</head>
<body>
<div class="stage"><canvas></canvas><div class="score"></div></div>
<script src="motion-kit.js"></script>
<script>
/* The score-pop moment, standalone. 750 -> 975 (+225, a fifth straight hit).
     0.08  anticipation: the number squashes on --dur-1
     0.22  the value flips and springs to 1.12 (one overshoot: scoring only),
           an amber afterglow, the ring expands, dot particles burst
     ~1.0  the particles land on the dot matrix and dissolve into it
     1.4+  clean on the new number */
const K = MotionKit
const DUR = 2
const d1 = K.sec('--dur-1'), d3 = K.sec('--dur-3'), d4 = K.sec('--dur-4')
const settle = K.ease('--ease-settle')
const C = {
  ink950: K.color('--ink-950'), fog100: K.color('--fog-100'), fog400: K.color('--fog-400'),
  amber: K.color('--signal-500'), amberHi: K.color('--signal-400'),
}
const FROM = 750, TO = 975
const FLIP = 0.22
const CX = 540, CY = 555
const PITCH = 36
const scoreEl = document.querySelector('.score')

// Particles: each flies out from the ring and lands on a dot-matrix cell.
const PARTICLES = Array.from({ length: 44 }, (_, i) => {
  const ang = (i / 44) * Math.PI * 2 + (K.hash(i, 1) - 0.5) * 0.12
  const r0 = 150
  const r1 = 300 + 230 * K.hash(i, 2)
  const snap = (v) => Math.round((v - PITCH / 2) / PITCH) * PITCH + PITCH / 2
  return {
    x0: CX + Math.cos(ang) * r0, y0: CY + Math.sin(ang) * r0 * 0.8,
    x1: snap(CX + Math.cos(ang) * r1), y1: snap(CY + Math.sin(ang) * r1 * 0.8),
    flight: 0.55 + 0.25 * K.hash(i, 3),
    size: 4 + 2.5 * K.hash(i, 4),
  }
})

function scale(t) {
  if (t < FLIP) return 1 - 0.035 * settle(K.seg(t, FLIP - d1 - 0.02, d1))
  const tau = t - FLIP
  if (tau < d1) return K.lerp(0.965, 1.12, settle(tau / d1))
  // Settle with a single, small undershoot.
  const s = tau - d1
  return 1 + 0.12 * Math.exp(-s / 0.13) * Math.cos((s / (d4 + d3)) * Math.PI * 2.2)
}

function draw(ctx, t) {
  ctx.fillStyle = K.rgba(C.ink950)
  ctx.fillRect(0, 0, 1080, 1080)
  K.dotGrid(ctx, {
    pitch: PITCH, radius: 1.5, fill: K.rgba(C.fog400),
    alphaAt: (x, y) => 0.18 * Math.max(0, 1 - Math.hypot(x - CX, y - CY) / 760),
  })

  const tau = t - FLIP
  // The ring.
  const xr = K.seg(tau, 0, d4 + d3)
  if (xr > 0 && xr < 1) {
    ctx.strokeStyle = K.rgba(C.amber, 0.85 * (1 - xr) ** 1.3)
    ctx.lineWidth = K.lerp(10, 1.5, xr)
    ctx.beginPath()
    ctx.arc(CX, CY, K.lerp(150, 560, settle(xr)), 0, Math.PI * 2)
    ctx.stroke()
  }
  // The particles: amber in flight, fog once they land, then gone.
  if (tau > 0) {
    for (const p of PARTICLES) {
      const f = settle(K.seg(tau, 0, p.flight))
      const fade = K.seg(tau, p.flight, d4)
      if (fade >= 1) continue
      const col = K.mixColor(C.amberHi, C.fog400, K.seg(tau, p.flight - 0.1, d3))
      ctx.fillStyle = K.rgba(col, (1 - fade) * K.clamp(tau / 0.05))
      ctx.beginPath()
      ctx.arc(K.lerp(p.x0, p.x1, f), K.lerp(p.y0, p.y1, f), K.lerp(p.size, 1.8, f), 0, Math.PI * 2)
      ctx.fill()
    }
  }
  // The delta, rising and fading.
  const xd = K.seg(tau, 0, d4 + d3)
  if (xd > 0 && xd < 1) {
    ctx.font = '500 34px "JetBrains Mono"'
    ctx.letterSpacing = `${0.09 * 34}px`
    ctx.textAlign = 'center'
    ctx.fillStyle = K.rgba(C.amber, K.clamp(xd * 6) * (1 - K.seg(tau, d4, d3)))
    ctx.fillText(`+${TO - FROM}`, CX + 0.045 * 34, 420 - 26 * settle(xd))
  }
  ctx.font = '500 26px "JetBrains Mono"'
  ctx.letterSpacing = `${0.09 * 26}px`
  ctx.textAlign = 'center'
  ctx.fillStyle = K.rgba(C.fog400)
  ctx.fillText('SCORE', CX + 0.045 * 26, 330)
  ctx.letterSpacing = '0px'

  // The number: flip, spring, afterglow.
  const glow = tau > 0 ? K.seg(tau, 0, d1 / 2) * (1 - settle(K.seg(tau, d1 / 2, d4 + d3))) : 0
  scoreEl.textContent = t < FLIP ? String(FROM) : String(TO)
  scoreEl.style.transform = `scale(${scale(t).toFixed(5)})`
  scoreEl.style.color = K.rgba(K.mixColor(C.fog100, C.amberHi, 0.55 * glow))
  scoreEl.style.textShadow = glow > 0.001
    ? `0 0 ${(40 * glow).toFixed(2)}px ${K.rgba(C.amber, 0.85 * glow)}, 0 0 ${(110 * glow).toFixed(2)}px ${K.rgba(C.amber, 0.4 * glow)}`
    : 'none'
}

K.film({
  duration: DUR,
  fonts: ['700 250px "Space Grotesk"', '500 26px "JetBrains Mono"'],
  draw,
})
</script>
</body>
</html>
